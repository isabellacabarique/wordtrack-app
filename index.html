<style>
  :root{
    --teal:#26B4C4;
    --teal-dark:#1C93A1;
    --teal-light:#E6F7F9;
    --ink:#1F2937;
    --muted:#6B7280;
    --gold:#D9A441;
    --card-shadow:0 2px 10px rgba(31,41,55,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#FAFBFC;
    color:var(--ink);
  }
  header{
    background:#fff;
    border-bottom:1px solid #EEF1F3;
    padding:16px 24px;
    display:flex;
    align-items:center;
  }
  header img{
    height:30px;
    display:block;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:26px 16px 60px;
  }
  .hero{
    text-align:center;
    margin-bottom:24px;
  }
  .hero h1{
    font-size:1.4rem;
    margin:0;
    font-weight:700;
  }
  .note{
    background:var(--teal-light);
    border:1px solid #CFEEF2;
    color:var(--teal-dark);
    padding:12px 14px;
    border-radius:10px;
    font-size:0.88rem;
    margin-bottom:22px;
    line-height:1.45;
  }
  .card{
    background:#fff;
    border:1px solid #EEF1F3;
    border-radius:14px;
    box-shadow:var(--card-shadow);
    padding:18px;
    margin-bottom:16px;
    display:flex;
    gap:16px;
  }
  .badge{
    flex:0 0 62px;
    height:62px;
    background:var(--teal);
    border-radius:12px;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height:1.1;
  }
  .badge .num{font-size:1.35rem;font-weight:700;}
  .badge .mon{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.03em;}
  .card.special .badge{background:var(--gold);}
  .card-body{flex:1;min-width:0;}
  .tag-special{
    display:inline-block;
    background:#FBF0DC;
    color:#9A6B12;
    font-size:0.72rem;
    font-weight:600;
    padding:2px 8px;
    border-radius:999px;
    margin-bottom:6px;
  }
  .card-body h3{
    margin:0 0 4px;
    font-size:1.02rem;
    font-weight:700;
  }
  .when{
    color:var(--ink);
    font-size:0.92rem;
    font-weight:600;
    margin-bottom:12px;
  }
  .zoom-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--teal);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:0.9rem;
    padding:9px 16px;
    border-radius:8px;
    margin-bottom:12px;
  }
  .zoom-btn:hover{background:var(--teal-dark);}
  .meeting-id{
    font-size:0.78rem;
    color:var(--muted);
    margin-bottom:12px;
  }
  .add-cal{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:4px;
  }
  .add-cal a, .add-cal button{
    font-family:inherit;
    font-size:0.8rem;
    color:var(--teal-dark);
    background:#fff;
    border:1px solid #D7EEF1;
    padding:6px 10px;
    border-radius:7px;

const ZOOM_LINK = "https://us06web.zoom.us/j/2475816106";
const MEETING_ID = "247 581 6106";
const CLASS_DURATION_MIN = 60;
const WEEKS_AHEAD = 8;          // cuántas semanas de clases mostrar
const COLOMBIA_OFFSET_H = 5;    // Colombia = UTC-5, sin horario de verano

// Las clases recurrentes solo se muestran a partir de esta fecha (incluida),
// hora Colombia, formato AAAA-MM-DD. Útil si vas a hacer una pausa o empezar

const SCHEDULE_START_DATE = "2026-08-19";

// Clases semanales recurrentes (se repiten para siempre).
// weekday: 0=domingo, 1=lunes, 2=martes, 3=miércoles, 4=jueves, 5=viernes, 6=sábado

  { weekday: 3, hour: 6,  minute: 0,  title: "Clase de práctica + feedback" }, // Miércoles 6:00am
];

// Sesiones especiales puntuales (opcional). Agrega un objeto por cada una:
// { date: "2026-08-20", hour: 19, minute: 30, title: "Sesión especial: ...", color: "#74f0d5" }

const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function pad(n){ return n < 10 ? "0"+n : ""+n; }

function toICSDate(d){
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z";
}

function escapeICS(s){
  return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}

function buildEvent(y, m, day, hour, minute, title, isSpecial, color){
  const startUTC = new Date(Date.UTC(y, m, day, hour + COLOMBIA_OFFSET_H, minute, 0));
  const endUTC = new Date(startUTC.getTime() + CLASS_DURATION_MIN * 60000);
  return {
    id: startUTC.getTime()+"-"+Math.random().toString(36).slice(2,8),
    title, startUTC, endUTC, isSpecial: !!isSpecial, color: color || null,
    description: "Clase de Immersa Academy. Únete aquí: " + ZOOM_LINK + " (ID de reunión: " + MEETING_ID + ")",
    location: ZOOM_LINK
  };
}

function getOccurrences(){
  const events = [];
  const now = Date.now();

  // "Hoy" en hora Colombia, usado como referencia de calendario
  const colombiaNow = new Date(now - COLOMBIA_OFFSET_H*3600000);
  const startY = colombiaNow.getUTCFullYear();
  const startM = colombiaNow.getUTCMonth();
  const startD = colombiaNow.getUTCDate();

  let scheduleStartRef = null;
  if(SCHEDULE_START_DATE){
    const [sy, sm, sd] = SCHEDULE_START_DATE.split("-").map(Number);
    scheduleStartRef = Date.UTC(sy, sm - 1, sd);
  }

  const daysAhead = WEEKS_AHEAD * 7 + 7;
  for(let i=0; i<daysAhead; i++){
    const dayRef = new Date(Date.UTC(startY, startM, startD + i));
    if(scheduleStartRef !== null && dayRef.getTime() < scheduleStartRef) continue;
    const weekday = dayRef.getUTCDay();
    RECURRING_CLASSES.forEach(def=>{
      if(def.weekday === weekday){
        const ev = buildEvent(dayRef.getUTCFullYear(), dayRef.getUTCMonth(), dayRef.getUTCDate(), def.hour, def.minute, def.title, false);
        if(ev.startUTC.getTime() > now - 5*60000) events.push(ev);
      }
    });
  }

  SPECIAL_SESSIONS.forEach(s=>{
    const [y,m,d] = s.date.split("-").map(Number);
    const ev = buildEvent(y, m-1, d, s.hour, s.minute, s.title, true, s.color);
    if(ev.startUTC.getTime() > now - 5*60000) events.push(ev);
  });

  events.sort((a,b)=> a.startUTC - b.startUTC);
  return events.slice(0, 14);
}

function googleLink(ev){
  const dates = toICSDate(ev.startUTC) + "/" + toICSDate(ev.endUTC);
  const p = new URLSearchParams({
    action: "TEMPLATE", text: ev.title, dates: dates,
    details: ev.description, location: ev.location
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

function outlookLink(ev){
  const p = new URLSearchParams({
    path: "/calendar/action/compose", rru: "addevent",
    startdt: ev.startUTC.toISOString(), enddt: ev.endUTC.toISOString(),
    subject: ev.title, body: ev.description, location: ev.location
  });
  return "https://outlook.live.com/calendar/0/deeplink/compose?" + p.toString();
}

function downloadICS(ev){
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Immersa Academy//Horario de clases//ES","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:"+ev.id+"@immersa-academy",
    "DTSTAMP:"+toICSDate(new Date()),
    "DTSTART:"+toICSDate(ev.startUTC),
    "DTEND:"+toICSDate(ev.endUTC),
    "SUMMARY:"+escapeICS(ev.title),
    "DESCRIPTION:"+escapeICS(ev.description),
    "LOCATION:"+escapeICS(ev.location),
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "clase-immersa-academy.ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
window.downloadICS_registry = {};

function tzAbbrev(){
  try{
    const parts = new Intl.DateTimeFormat([], {timeZoneName:"short"}).formatToParts(new Date());
    const tz = parts.find(p=>p.type==="timeZoneName");
    return tz ? tz.value : "";
  }catch(e){ return ""; }
}

// Día, hora y franja horaria del ESTUDIANTE, detectados automáticamente por su navegador
// Formatea la hora local en 12h con AM/PM manualmente (no depende del
// formato regional del navegador/SO, que a veces ignora hour12 de Intl).
function formatLocalTime12(d){
  let h = d.getHours();
  const m = d.getMinutes();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if(h === 0) h = 12;
  return pad(h) + ":" + pad(m) + " " + ampm;
}

function localWhenString(startUTC, endUTC){
  const weekdayFmt = new Intl.DateTimeFormat("es", {weekday:"long"});
  let weekday = weekdayFmt.format(startUTC);
  weekday = weekday.charAt(0).toUpperCase()+weekday.slice(1);
  const s = formatLocalTime12(startUTC);
  const e = formatLocalTime12(endUTC);
  const tz = tzAbbrev();
  return weekday + " · " + s + " – " + e + (tz ? " (" + tz + ")" : "");
}

function render(){
  const events = getOccurrences();
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  list.innerHTML = "";

  if(events.length === 0){
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  events.forEach(ev=>{
    // Fecha del badge en la zona horaria del estudiante (getters locales, no UTC)
    const dayNum = ev.startUTC.getDate();
    const monAbbr = MESES[ev.startUTC.getMonth()];

    const card = document.createElement("div");
    card.className = "card" + (ev.isSpecial ? " special" : "");

    const icsId = "ics-" + ev.id;
    window.downloadICS_registry[icsId] = ev;

    card.innerHTML = `
      <div class="badge"${ev.color ? ` style="background:${ev.color}"` : ''}>
        <div class="num">${dayNum}</div>
        <div class="mon">${monAbbr}</div>
      </div>
      <div class="card-body">
        ${ev.isSpecial ? '<span class="tag-special">Sesión especial</span>' : ''}
        <h3>${ev.title}</h3>
        <div class="when">${localWhenString(ev.startUTC, ev.endUTC)}</div>
        <a class="zoom-btn" href="${ZOOM_LINK}" target="_blank" rel="noopener">🔗 Unirse a Zoom</a>
        <div class="add-cal">
          <span class="add-cal-label">Agregar a tu calendario:</span>
          <a href="${googleLink(ev)}" target="_blank" rel="noopener">Google Calendar</a>
          <a href="${outlookLink(ev)}" target="_blank" rel="noopener">Outlook</a>
          <button type="button" data-ics="${icsId}">Apple / Otro (.ics)</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll("button[data-ics]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const ev = window.downloadICS_registry[btn.getAttribute("data-ics")];
      downloadICS(ev);
    });
  });
}

render();
</script>
